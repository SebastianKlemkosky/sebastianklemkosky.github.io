
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sebastian Klemkosky | Portfolio</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>

        <!-- SURFACE BIOME -->
        <section class="surface" aria-label="Surface biome">

            <div class="sky"></div>

            <!-- Parallax layers -->
            <div class="mountains mountains-far"></div>
            <div class="mountains mountains-near"></div>

            <!-- Ground -->
            <div class="terrain"></div>
            <div class="grass-edge"></div>

        </section>


        <!-- UNDERGROUND TRANSITION -->
        <section class="underground" aria-label="Underground biome">

            <div class="dirt-layer"></div>
            <div class="dirt-stone-layer"></div>
            <div class="stone-layer"></div>

        </section>




    </main>
</body>
</html>
